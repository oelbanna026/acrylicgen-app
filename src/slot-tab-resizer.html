<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Resize Slots / Tabs | Acrylic Designer Pro</title>
  <meta name="description" content="Resize slots and tabs (finger joints) automatically for new material thickness. SVG/DXF supported.">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="canonical" href="https://acrylicgen-app.com/slot-tab-resizer.html" />
  <script src="vendor/tailwindcss.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold">أداة تعديل التعشيقات (Slots/Tabs)</h1>
        <p class="text-sm text-slate-300 mt-1">تدعم SVG/DXF للخطوط المستقيمة والزوايا 90° فقط. التصدير افتراضياً يكون للتصميم الجديد فقط.</p>
      </div>
      <a href="index.html" class="text-blue-300 hover:text-blue-200 font-bold">العودة للتطبيق</a>
    </div>

    <div class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-4">
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div class="font-bold">الملف</div>
            <div id="fileBadge" class="text-xs text-slate-400"></div>
          </div>
          <input id="fileInput" type="file" accept=".svg,.dxf" class="block w-full text-sm text-slate-200 file:mr-4 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 bg-slate-900/30 rounded-md">
          <div id="parseReport" class="text-xs text-slate-300"></div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-4">
          <div class="font-bold">الإعدادات</div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Old thickness (mm)</label>
              <input id="oldT" type="number" step="0.01" value="3" class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">New thickness (mm)</label>
              <input id="newT" type="number" step="0.01" value="4" class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Tolerance (mm)</label>
              <input id="tol" type="number" step="0.01" value="0.15" class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Kerf (mm)</label>
              <input id="kerf" type="number" step="0.01" value="0.15" class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="adjSlotDepth" type="checkbox" checked>
              Adjust Slot Depth
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="adjSlotWidth" type="checkbox">
              Adjust Slot Width
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="adjTabHeight" type="checkbox" checked>
              Adjust Tab Height
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="livePreview" type="checkbox" checked>
              Preview
            </label>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="autoSpace" type="checkbox" checked>
              Auto-space parts
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-200">
              <input id="includeBackup" type="checkbox">
              Include backup layer
            </label>
          </div>

          <div class="grid grid-cols-3 gap-3 pt-2">
            <button id="applyBtn" class="rounded-md bg-teal-600 text-white py-2 text-sm font-bold disabled:opacity-50 hover:bg-teal-700">Apply</button>
            <button id="okBtn" class="rounded-md bg-blue-600 text-white py-2 text-sm font-bold disabled:opacity-50 hover:bg-blue-700">OK</button>
            <button id="cancelBtn" class="rounded-md bg-slate-800 text-white py-2 text-sm font-bold hover:bg-slate-700">Cancel</button>
          </div>
          <div id="actionReport" class="text-xs text-slate-300"></div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="font-bold">تصدير</div>
          <div class="grid grid-cols-2 gap-3">
            <button id="exportSvgBtn" class="rounded-md bg-slate-800 text-white py-2 text-sm font-bold disabled:opacity-50 hover:bg-slate-700">Export SVG</button>
            <button id="exportDxfBtn" class="rounded-md bg-slate-800 text-white py-2 text-sm font-bold disabled:opacity-50 hover:bg-slate-700">Export DXF</button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2 space-y-4">
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
          <div class="font-bold">Preview</div>
          <div id="stats" class="text-xs text-slate-300"></div>
        </div>
        <div class="bg-white rounded-xl border border-slate-800 overflow-hidden">
          <div id="previewHost" class="w-full h-[78vh] bg-white"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/slotTabResizer.js?v=1"></script>
</body>
</html>
